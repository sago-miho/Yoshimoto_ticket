<form th:action="@{/event/save}" th:object="${event}" method="post">
    
    <div class="form-group">
        <label>公演名</label>
        <input type="text" th:field="*{title}">
    </div>

    <div class="form-group">
        <label>会場</label>
        <input type="text" th:field="*{venue}">
    </div>

    <div class="form-group">
        <label>日時</label>
        <input type="datetime-local" th:field="*{date}">
    </div>

    <div class="form-group">
        <label>出演者</label>
        <input type="text" th:field="*{castNames}">
    </div>

    <div class="form-group">
        <label>チケット料金（円）</label>
        <input type="number" th:field="*{price}">
    </div>

    <div class="form-group">
        <label>販売総数（枚）</label>
        <input type="number" th:field="*{totalTickets}">
    </div>

    <button type="submit" class="submit-button">公演を登録する</button>
</form>
